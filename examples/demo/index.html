<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>Task dashboard</title>
<style>
  :root {
    --bg: #0b0f0d; --panel: #121815; --line: #223029; --text: #e6efe9; --muted: #8fa398;
    --accent: #16a34a; --warn: #d97706; --bad: #dc2626; --idle: #4b5a52;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8f7; --panel: #fff; --line: #dbe3de; --text: #14201a; --muted: #5d6f65; --idle: #a9b6ae; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .goal { color: var(--muted); margin: 0 0 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi, section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .col { display: grid; gap: 16px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .step:first-of-type { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin: 5px 0 0 4px; background: var(--idle); }
  .done .dot { background: var(--accent); }
  .running .dot { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .blocked .dot { background: var(--warn); } .failed .dot { background: var(--bad); }
  .pending .title { color: var(--muted); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .tok { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
  .card { border-top: 1px solid var(--line); padding: 10px 0; }
  .card:first-of-type { border-top: 0; padding-top: 0; }
  .tag { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); margin-top: 6px; }
  .tag.read { color: var(--accent); border-color: var(--accent); }
  .answer { margin-top: 4px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script>
  const d = window.DASHBOARD;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (n) => n == null ? '—' : n.toLocaleString('en-US');
  const steps = [...d.steps].sort((a, b) => a.order - b.order);
  const done = steps.filter((s) => s.status === 'done').length;
  const tokens = steps.reduce((t, s) => t + (s.tokens || 0), 0);
  const open = d.blockers.filter((b) => !b.resolved);
  const unanswered = d.questions.filter((q) => !q.answer).length;

  // Same status rules as the live page.
  function qStatus(q) {
    if (!q.answer) return ['default: ' + q.default, ''];
    if (!q.seen) return ['not read yet', ''];
    return q.seen === q.answer_rev ? ['read', 'read'] : ['changed', ''];
  }

  document.title = d.meta.title;
  document.getElementById('app').innerHTML = `
    <h1>${esc(d.meta.title)}</h1>
    <p class="goal">${esc(d.meta.goal)}</p>
    <div class="kpis">
      <div class="kpi"><b>${done} / ${steps.length}</b><span>steps done</span></div>
      <div class="kpi"><b>${num(tokens)}</b><span>tokens so far</span></div>
      <div class="kpi"><b>${unanswered}</b><span>open questions</span></div>
      <div class="kpi"><b>${open.length}</b><span>blockers</span></div>
    </div>
    <div class="grid">
      <section>
        <h2>Steps</h2>
        <div class="bar"><i style="width:${Math.round(done / steps.length * 100)}%"></i></div>
        ${steps.map((s) => `
          <div class="step ${s.status}">
            <span class="dot" title="${s.status}"></span>
            <div><div class="title">${s.order}. ${esc(s.title)}</div>
              <div class="sub">${esc(s.result || s.note || s.status)}</div></div>
            <span class="tok">${num(s.tokens)}</span>
          </div>`).join('')}
      </section>
      <div class="col">
        <section>
          <h2>Questions for you</h2>
          ${d.questions.map((q) => { const [label, cls] = qStatus(q); return `
            <div class="card"><div>${esc(q.text)}</div>
              ${q.answer ? `<div class="answer"><b>${esc(q.answer)}</b></div>` : ''}
              <span class="tag ${cls}">${esc(label)}</span></div>`; }).join('')}
          <div class="sub" style="margin-top:10px">Local mode: answer in chat.</div>
        </section>
        <section>
          <h2>What's stuck</h2>
          ${open.length ? open.map((b) => `<div class="card">${esc(b.text)}</div>`).join('') : '<div class="sub">Nothing.</div>'}
        </section>
        <section>
          <h2>Results</h2>
          ${d.results.map((r) => `<div class="card"><b>${esc(r.title)}</b><div class="sub">${esc(r.summary)}</div></div>`).join('')}
        </section>
      </div>
    </div>
    <footer>Updated ${esc(d.meta.updated_at)} · reloads every 10 seconds</footer>`;
</script>
</body>
</html>
